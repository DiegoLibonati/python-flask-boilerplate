services:

  boilerplate-server:
    build:
      context: .
      dockerfile: Dockerfile.development
    restart: always
    env_file:
      - ./.env
    volumes:
      - ".:/home/app"
      - "/home/app/venv"
      - "/home/app/.pytest_cache"
      - "/home/app/.ruff_cache"
      - "/home/app/__pycache__"
    ports:
      - "5050:5050"
    networks:
      - boilerplate-net

networks:
  boilerplate-net:
    driver: bridge
